name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      # the hook relay's fail-safes, end to end over a real socket
      - run: tests/relay-failsafe.sh
      # the chat path against a stdlib mock LLM (no key, no network), with the
      # fake ewe-safe and ewe-browser in tests/fakes/
      - run: tests/chat.sh
      # names stay local: Safe's titles and usernames reach no provider, log or store
      - run: tests/canary.sh
