[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.2.1-beta"
edition = "2024"
license = "MIT"
repository = "https://github.com/prj786/ewe-companion"
rust-version = "1.90"

[workspace.dependencies]
companion-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync", "fs", "process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
ignore = "0.4.33"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
